random_seed: 42

experiment:
  name: "exp_test"
  description: "An FL environment created using a tiny dataset, just to test codebase"

training:
  multi_class: true
  batch_size: 2
  max_epochs: 2

  optimizer: "adam"
  learning_rate: 0.001
  lr_decay: true
  lr_decay_rate: 0.5
  weight_decay: 0.01

  LAMBD_2: 0.01
  dropout: true
  dropout_rate: 0.5
  batch_norm: true

fl:
  num_rounds: 5
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  num_clients: 5
  min_fit_clients: 5
  min_evaluate_clients: 5
  min_available_clients: 5

logging:
  selected_type: "tensorboard"
  wandb:
    project: "FL-GDLC-exp-test"
    entity: "mtermos-cesi"
    tags: [ "exp_test" ]
    save_dir: "logs/wandb_runs"
  tensorboard:
    project: "FL-GDLC-exp-test"
    save_dir: "logs/tensorboard_runs"

datasets:
- name: "df1"
  raw: "df1.parquet"
  raw_type: "parquet"
  num_clients: 3
  global_test_size: 0.2

- name: "df2"
  raw: "df2.parquet"
  raw_type: "parquet"
  num_clients: 2
  global_test_size: 0.2

dataset_properties:
  processed_dir: "datasets/exp_test"
  src_ip_col: "src_ip"
  dst_ip_col: "dst_ip"
  timestamp_col: "timestamp"
  flow_id_col: "flow_id"
  timestamp_format: "%d/%m/%Y %I:%M:%S %p"
  label_col: "label"
  class_col: "class"
  class_num_col: "class_num"
  val_size: 0.2
  drop_columns: [ "flow_id", "src_ip", "dst_ip", "timestamp", "class" ]
  weak_columns: [ "f2" ]
