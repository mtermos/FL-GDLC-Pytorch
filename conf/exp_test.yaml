defaults:
- _self_
- training@training

random_seed: 42

experiment:
  name: "exp_test"
  description: "An FL environment created using a tiny dataset, just to test codebase"

fl:
  num_rounds: 2
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  num_clients: 2
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_clients: 2
  clients_to_val: [ 0, 1 ]

logging:
  selected_type: "tensorboard"
  wandb:
    project: "FL-GDLC-exp-test"
    entity: "mtermos-cesi"
    tags: [ "exp_test" ]
    save_dir: "logs/wandb_runs"
  tensorboard:
    project: "FL-GDLC-exp-test"
    save_dir: "logs/tensorboard_runs"

datasets:
- name: "df1"
  raw: "df1.parquet"
  raw_type: "parquet"
  num_clients: 1
  global_test_size: 0.2

- name: "df2"
  raw: "df2.parquet"
  raw_type: "parquet"
  num_clients: 1
  global_test_size: 0.2

dataset_properties:
  processed_dir: "datasets/exp_test"
  src_ip_col: "src_ip"
  dst_ip_col: "dst_ip"
  timestamp_col: "timestamp"
  flow_id_col: "flow_id"
  timestamp_format: "%d/%m/%Y %I:%M:%S %p"
  label_col: "label"
  class_col: "class"
  class_num_col: "class_num"
  val_size: 0.2
  drop_columns: [ "flow_id", "src_ip", "dst_ip", "timestamp", "class", "class_num", "label" ]
  weak_columns: [ "f2" ]
