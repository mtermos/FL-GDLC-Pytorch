# pca_gdlc experiment configuration
defaults:
  - _self_
  - exp1/base_config@base


experiment:
  exp: "exp1"
  type: "pca_gdlc"
  description: "PCA_GDLC experiment with basic CNN model"
  num_pca_components: 3
  
additional_columns:
  pca_columns:
    - "global_pca_1"
    - "global_pca_2"
    - "global_pca_3"

logging:
  wandb:
    name: "pca_gdlc_cnn"
    additional_tags: ["pca_gdlc", "cnn"]
    save_dir: "logs/wandb_runs"