  processed_dir: "datasets/exp1"
  label_col: "Label"
  class_col: "Attack"
  class_num_col: "Class"
  val_size: 0.1
  drop_columns:
    - Flow ID
    - Src IP
    - Dst IP
    - Timestamp
    - Src Port
    - Dst Port
    - Attack

  weak_columns:
    - Flow Duration
    - Tot Bwd Pkts
    - TotLen Bwd Pkts
    - Fwd Pkt Len Max
    - Fwd Pkt Len Mean
    - Bwd Pkt Len Max
    - Bwd Pkt Len Mean
    - Bwd Pkt Len Std
    - Flow Pkts/s
    - Flow IAT Mean
    - Flow IAT Max
    - Fwd IAT Mean
    - Bwd IAT Mean
    - Pkt Len Max
    - Pkt Len Mean
    - Pkt Size Avg
    - Fwd Byts/b Avg
    - Fwd Pkts/b Avg
    - Fwd Blk Rate Avg
    - Active Mean
    - Idle Mean

training:
  multi_class: false
  batch_size: 256
  max_epochs: 3
      
  optimizer: "adam"
  learning_rate: 0.001
  lr_decay: true
  lr_decay_rate: 0.5
  weight_decay: 0.01

  LAMBD_2: 0.01
  dropout: true
  dropout_rate: 0.5
  batch_norm: true 


fl:
  num_rounds: 5
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  num_clients: 2
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_clients: 2
  # num_clients: 8
  # min_fit_clients: 8
  # min_evaluate_clients: 8
  # min_available_clients: 8


logging:
  selected_type: "wandb"
  wandb:
    project: "FL-GDLC"
    entity: "mtermos-cesi"
    tags: ["exp1", "cic_ton_iot", "cic_ids_2017"]
    save_dir: "logs/wandb_runs"
  tensorboard:
    save_dir: "logs/tensorboard_runs"

