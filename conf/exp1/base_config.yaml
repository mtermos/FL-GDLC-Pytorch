    - dataset_properties:
        name: "cic_ids_2017_5_percent"
        raw: "cic_ids_2017_5_percent.parquet"
        raw_type: "parquet"
        num_clients: 3
        global_test_size: 0.1
        src_ip_col: "Src IP"
        dst_ip_col: "Dst IP"
        timestamp_col: "Timestamp"
        flow_id_col: "Flow ID"
        timestamp_format: "%d/%m/%Y %I:%M:%S %p"
        label_col: "Label"
        class_col: "Attack"
