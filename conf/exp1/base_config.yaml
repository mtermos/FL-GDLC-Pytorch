          - Fwd Pkts/b Avg
          - Fwd Blk Rate Avg
          - Bwd Byts/b Avg
          - Bwd Pkts/b Avg
          - Bwd Blk Rate Avg
          - Fwd IAT Min
          - Idle Max
          - Flow IAT Mean
          - Protocol
          - Fwd Pkt Len Max
          - Flow IAT Max
          - Active Std
          - Subflow Fwd Pkts
          - Bwd Pkt Len Mean
          - Tot Bwd Pkts
          - Pkt Size Avg
          - Subflow Bwd Pkts
          - Bwd IAT Std
          - Fwd IAT Mean
          - Fwd Pkt Len Std
          - Pkt Len Mean
          - Flow IAT Std
          - Fwd URG Flags
          - TotLen Bwd Pkts
          - Bwd Pkt Len Max
          - Pkt Len Var
          - Tot Fwd Pkts
          - Bwd IAT Mean
          - TotLen Fwd Pkts
          - Fwd PSH Flags
          - Idle Mean
