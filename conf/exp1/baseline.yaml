# Baseline experiment configuration
defaults:
  - _self_
  - exp1/base_config@base

experiment:
  exp: "exp1"
  type: "baseline"
  description: "Baseline experiment with basic CNN model"

data_features:
  selected_centralities:
    degree: false
    betweenness: false
    pagerank: false
  all_centralities:
    compute: false
  pca_gdlc:
    enabled: false

models:
  # - cnn
  - mlp

logging:
  wandb:
    name: "baseline_cnn"
    additional_tags: ["baseline", "cnn"]
    save_dir: "logs/wandb_runs"