# GRU model configuration
model:
  name: "gru"
  type: "gru"

layers:
- gru
- dense

input_layer_norm: False

sequence_length: 3

# GRU layers
gru:
  hidden_size: [ 80 ]
  # activation: "leaky_relu"
  activation: "gelu"
  dropout: True
  dropout_rate: 0.3
  batch_norm: False
  layer_norm: True
  bidirectional: False

# Dense layers
dense:
  units: [ 200, 100, 50 ]
  # activation: "leaky_relu"
  activation: "gelu"
  dropout: True
  dropout_rate: 0.3
  batch_norm: False
  layer_norm: True
