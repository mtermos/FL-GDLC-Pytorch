# CNN-LSTM model configuration
model:
  name: "cnn_lstm"
  type: "cnn_lstm"

layers:
- cnn
- lstm
- dense

input_layer_norm: true

# CNN layers
cnn:
  filters: [ 80, 80 ]
  kernel_sizes: [ 5, 5 ]
  activation: "leaky_relu"
  dropout: true
  dropout_rate: 0.3
  batch_norm: false
  layer_norm: true

# LSTM layers
lstm:
  hidden_size: [ 80 ]
  activation: "leaky_relu"
  dropout: true
  dropout_rate: 0.3
  batch_norm: true
  layer_norm: false

# Dense layers
dense:
  units: [ 200, 100, 50 ]
  activation: "leaky_relu"
  dropout: true
  dropout_rate: 0.3
  batch_norm: true
  layer_norm: false
