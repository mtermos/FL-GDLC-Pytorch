# CNN-LSTM model configuration
model:
  name: "cnn_lstm"
  type: "cnn_lstm"

layers:
- cnn
- lstm
- dense

input_layer_norm: False

# CNN layers
cnn:
  filters: [ 80, 80 ]
  # kernel_sizes: [ 2, 2 ]
  # kernel_sizes: [ 3, 3 ]
  # kernel_sizes: [ 5, 5 ]
  kernel_sizes: [ 7, 7 ]
  # activation: "leaky_relu"
  activation: "gelu"
  # pooling_type: "max"
  pooling_type: "avg"
  # last_layer_pooling_type: "adaptive_avg"
  # last_layer_pooling_type: "adaptive_max"
  # last_layer_pooling_type: "max"
  last_layer_pooling_type: "avg"
  dropout: True
  dropout_rate: 0.5
  batch_norm: False
  layer_norm: True

# LSTM layers
lstm:
  hidden_size: [ 80, 80 ]
  # activation: "leaky_relu"
  activation: "gelu"
  dropout: True
  dropout_rate: 0.3
  batch_norm: False
  layer_norm: True
  bidirectional: False

# Dense layers
dense:
  units: [ 200, 100, 50 ]
  # activation: "leaky_relu"
  activation: "gelu"
  dropout: True
  dropout_rate: 0.2
  batch_norm: False
  layer_norm: True
