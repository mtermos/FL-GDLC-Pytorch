# CNN-LSTM model configuration
model:
  name: "cnn_lstm"
  type: "cnn_lstm"
  
layers:
  - cnn
  - lstm
  - dense

# CNN layers
cnn:
  filters: [80, 80]
  kernel_sizes: [3, 3]
  activation: "leaky_relu"
  dropout: true
  dropout_rate: 0.3
  batch_norm: true

# LSTM layers
lstm:
  hidden_size: [80]
  activation: "leaky_relu"
  dropout: true
  dropout_rate: 0.3
  batch_norm: true

# Dense layers
dense:
  units: [200, 200, 80]
  activation: "leaky_relu"
  dropout: true
  dropout_rate: 0.3
  batch_norm: true