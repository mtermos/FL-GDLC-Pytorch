# CNN model configuration
model:
  name: "cnn"
  type: "cnn"

layers:
- cnn
- dense

input_layer_norm: true

# CNN layers
cnn:
  filters: [ 50 ]
  kernel_sizes: [ 5, 5 ]
  # activation: "relu"
  activation: "leaky_relu"
  dropout: false
  dropout_rate: 0.5
  batch_norm: false
  layer_norm: true

# Dense layers
dense:
  units: [ 100, 80 ]
  # activation: "relu"
  activation: "leaky_relu"
  dropout: false
  dropout_rate: 0.5
  batch_norm: false
  layer_norm: true
