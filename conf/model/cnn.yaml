# CNN model configuration
model:
  name: "cnn"
  type: "cnn"
  
layers:
  - cnn
  - dense

# CNN layers
cnn:
  layers: [80, 80]
  kernel_sizes: [3, 3]
  activation: "leaky_relu"
  dropout: 0.3
  batch_norm: true

# Dense layers
dense:
  units: [200, 80]
  activation: "leaky_relu"
  dropout: 0.1
  batch_norm: true