# CNN model configuration
model:
  name: "cnn"
  type: "cnn"

layers:
- cnn
- dense

input_layer_norm: false

# CNN layers
cnn:
  # filters: [ 80 ]
  # kernel_sizes: [ 5 ]
  filters: [ 80, 80 ]
  kernel_sizes: [ 7, 7 ]
  # activation: "relu"
  # activation: "leaky_relu"
  activation: "gelu"
  # pooling_type: "max"
  pooling_type: "avg"
  # last_layer_pooling_type: "adaptive_avg"
  # last_layer_pooling_type: "adaptive_max"
  # last_layer_pooling_type: "max"
  last_layer_pooling_type: "avg"
  dropout: true
  dropout_rate: 0.5
  batch_norm: false
  layer_norm: true

# Dense layers
dense:
  # units: [ 200 ]
  # units: [ 200, 100 ]
  units: [ 200, 100, 80 ]
  # activation: "relu"
  # activation: "leaky_relu"
  activation: "gelu"
  pooling_type: "max"
  dropout: true
  dropout_rate: 0.2
  batch_norm: false
  layer_norm: true
