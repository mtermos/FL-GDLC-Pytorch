# LSTM model configuration
model:
  name: "lstm"
  type: "lstm"

layers:
- lstm
- dense

input_layer_norm: False

sequence_length: 3

# LSTM layers
lstm:
  hidden_size: [ 80 ]
  # activation: "leaky_relu"
  activation: "gelu"
  dropout: True
  dropout_rate: 0.3
  batch_norm: False
  layer_norm: True
  bidirectional: False

# Dense layers
dense:
  units: [ 200, 100, 50 ]
  # activation: "leaky_relu"
  activation: "gelu"
  dropout: True
  dropout_rate: 0.3
  batch_norm: False
  layer_norm: True
