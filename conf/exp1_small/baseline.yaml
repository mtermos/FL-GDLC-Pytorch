# Baseline experiment configuration
defaults:
  - _self_
  - exp1_small/base_config@base

experiment:
  exp: "exp1_small"
  type: "baseline"
  description: "Baseline experiment with basic CNN model"

data_features:
  selected_centralities:
    degree: false
    betweenness: false
    pagerank: false
  all_centralities:
    compute: false
  pca_gdlc:
    enabled: false

logging:
  wandb:
    name: "baseline_cnn"
    additional_tags: ["baseline", "cnn"]
    save_dir: "logs/wandb_runs"